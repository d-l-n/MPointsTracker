<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MPoints Tracker">
  <defs>
    <linearGradient id="bg" x1="200" y1="0" x2="1000" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07181b"/>
      <stop offset="0.58" stop-color="#041012"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="table" x1="60" y1="80" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fc7cf"/>
      <stop offset="0.5" stop-color="#006d77"/>
      <stop offset="1" stop-color="#003c43"/>
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="200" x2="1100" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7f4f8"/>
      <stop offset="0.52" stop-color="#5fc7cf"/>
      <stop offset="1" stop-color="#006d77"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <path fill="url(#table)" d="M0 0h700c48 240 26 416-66 526C498 725 260 750 0 726z"/>

  <circle cx="900" cy="500" r="400" fill="url(#glow)" opacity="0.6"/>

  <g filter="url(#shadow)">
    <path
      fill="#f7ffff"
      d="M160 180h120l216 216 216-216h120v550h-120V328l-156 156h-120L280 328v402H160z"
    />
  </g>

  <text x="160" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#5fc7cf" letter-spacing="6">MPOINTS</text>
  <text x="160" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#8da8ae" letter-spacing="2">TRACKER</text>

  <text x="900" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#b7f4f8" text-anchor="end" opacity="0.7">Registrá partidas</text>
  <text x="900" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#b7f4f8" text-anchor="end" opacity="0.7">Seguí estadísticas</text>
  <text x="900" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#b7f4f8" text-anchor="end" opacity="0.7">Jugá con amigos</text>

  <rect x="760" y="445" width="2" height="105" rx="1" fill="#006d77"/>
</svg>
