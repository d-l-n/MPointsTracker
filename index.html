    <!-- Boot watchdog: pantalla de aviso si la app no puede arrancar (p. ej. fallo del módulo JS).
         Debe ser inline y autocontenido: corre aunque el bundle principal nunca cargue. -->
    <style id="mp-boot-styles">
      .mp-boot-backdrop{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(3,12,14,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eefcff}
      .mp-boot-backdrop[hidden]{display:none}
      .mp-boot-card{width:min(420px,100%);background:rgba(9,30,34,.94);border:1px solid rgba(95,199,207,.28);border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:mp-boot-in .28s cubic-bezier(.16,1,.3,1)}
      @keyframes mp-boot-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
      .mp-boot-mark{width:52px;height:52px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;background:#006d77;border-radius:14px}
      .mp-boot-title{margin:0 0 10px;font-size:20px;font-weight:700;letter-spacing:.2px}
      .mp-boot-message{margin:0 0 20px;font-size:14px;line-height:1.55;color:#b7d7dc}
      .mp-boot-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
      .mp-boot-btn{flex:1;min-width:150px;padding:12px 16px;border-radius:12px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s ease,filter .15s ease;font-family:inherit}
      .mp-boot-btn:active{transform:scale(.97)}
      .mp-boot-btn-primary{background:#006d77;color:#fff}
      .mp-boot-btn-primary:hover{filter:brightness(1.12)}
      .mp-boot-btn-ghost{background:transparent;color:#eefcff;border-color:rgba(255,255,255,.22)}
      .mp-boot-btn-ghost:hover{background:rgba(255,255,255,.06)}
    </style>
    <script>
      (function () {
        "use strict";
        var READY_ATTR = "data-mp-ready";
        var shown = false;
        var timer = null;

        function isReady() {
          return document.documentElement.getAttribute(READY_ATTR) === "1";
        }

        function buildCard(message) {
          var card = document.createElement("div");
          card.className = "mp-boot-backdrop";
          card.id = "mp-boot-error";
          card.setAttribute("data-testid", "boot-error-card");
          card.setAttribute("role", "alert");
          card.innerHTML =
            '<div class="mp-boot-card">' +
            '<div class="mp-boot-mark" aria-hidden="true">!</div>' +
            '<h1 class="mp-boot-title">No se pudo cargar la app</h1>' +
            '<p class="mp-boot-message"></p>' +
            '<div class="mp-boot-actions">' +
            '<button type="button" class="mp-boot-btn mp-boot-btn-primary" data-mp-action="reload">Reintentar</button>' +
            '<button type="button" class="mp-boot-btn mp-boot-btn-ghost" data-mp-action="purge">Limpiar caché y reintentar</button>' +
            '</div></div>';
          card.querySelector(".mp-boot-message").textContent = message;

          card.querySelector('[data-mp-action="reload"]').addEventListener("click", function () {
            window.location.reload();
          });
          card.querySelector('[data-mp-action="purge"]').addEventListener("click", function () {
            var jobs = [];
            if ("caches" in window) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {}));
            }
            if ("serviceWorker" in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {}));
            }
            // Recargamos siempre, aunque algún paso de limpieza falle
            // (p. ej. modo privado sin caches accesibles).
            Promise.all(jobs).then(function () { window.location.reload(); });
          });
          return card;
        }

        function show(message) {
          if (shown || isReady()) return;
          shown = true;
          if (timer) clearTimeout(timer);
          var card = document.getElementById("mp-boot-error") || buildCard(message);
          if (!card.parentNode && document.body) document.body.appendChild(card);
        }

        function hide() {
          var card = document.getElementById("mp-boot-error");
          if (card) card.remove();
        }

        // Fallo de carga de un <script> (p. ej. MIME incorrecto o 404 del bundle).
        window.addEventListener("error", function (ev) {
          if (isReady() || shown) return;
          var t = ev && ev.target;
          if (t && t.tagName === "SCRIPT") {
            show("Parece que hubo un problema al cargar los archivos de la app. Probá reintentar y, si sigue fallando, limpiá la caché guardada.");
          }
        }, true);

        // Watchdog: si en 12s la app no arrancó, mostramos el aviso igual.
        timer = window.setTimeout(function () {
          if (!isReady() && !shown) {
            show("La app está tardando más de lo esperado en cargar. Puede haber un problema de conexión o de caché guardada.");
          }
        }, 12000);

        // Si la app termina de arrancar después del watchdog (carga lenta), ocultamos el aviso.
        // El intervalo se autolimpia apenas no hace falta más.
        var interval = window.setInterval(function () {
          if (isReady()) {
            if (shown) hide();
            clearInterval(interval);
          }
        }, 1000);
      })();
    </script>
