# Scripts de build (postinstall) que permitimos correr en la instalación.
#   - @firebase/util  → escribe dist/postinstall.js (solo reacciona si hay FIREBASE_WEBAPP_CONFIG)
#   - protobufjs      → genera los descriptors de google/protobuf dentro del paquete
#   - re2             → binario nativo opcional de firebase-tools (prebuilt vía install-artifact-from-github)
# Nota: pnpm 11 renombró `onlyBuiltDependencies` (pnpm 10) a `allowBuilds` con
# valores true/false. Sin este bloque, `pnpm install --frozen-lockfile` en CI
# falla con ERR_PNPM_IGNORED_BUILDS aunque los scripts sean inofensivos.
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  re2: true
