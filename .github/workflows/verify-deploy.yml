name: Verify deploy

# Post-deploy sanity check: tras cada push a main, Cloudflare Pages redespliega
# vía Git integration. Este workflow espera a que el build termine y verifica
# que el index.html servido referencia el bundle compilado (/assets/*) y no el
# source (/src/main.tsx). Si el deploy quedó roto, el commit se marca en rojo.
on:
  push:
    branches: [main]

jobs:
  share-emulator-e2e:
    name: Share E2E against local emulators
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Firestore emulator is a Java process; ubuntu runners don't ship a JDK.
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run share-emulator E2E suite
        run: npm run test:share

  verify-deploy:
    name: Check production serves the built app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run post-deploy verification
        env:
          DEPLOY_URL: https://mpoints-tracker.pages.dev/
          # Opcional: si están configurados, el check espera específicamente a que
          # el deployment de ESTE commit termine (más preciso que sondear la URL).
          # Sin ellos, igual verifica la URL con reintentos hasta el timeout.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-deploy.mjs --commit "${{ github.sha }}" --wait 420
